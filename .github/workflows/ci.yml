name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck mc install.sh uninstall.sh scripts/update-checksum.sh tests/run.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # macOS ships bash 3.2, which the README promises to support.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: brew install gnupg
      - run: tests/run.sh
        env:
          TEST_BASH: ${{ matrix.bash }}
